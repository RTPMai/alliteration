<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Change password — alliteration.</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<!-- Change password, Oct 2026.

     Two ways in:
       1. Forced. Signed in on a password an Admin set (a new account, a
          reset, a CrewCore roster login). The shell sends them here, and
          every API answers "change your temporary password first" until they
          do, so there is no way round it but this page.
       2. Chosen. The avatar menu's "Change password", any time.

     Like login.html this page touches no browser storage and talks to
     /api/auth only (test/auth-live.test.cjs and test/password-change.test.cjs
     both check), and follows the system theme for the same reason. -->
<script>
  (function () {
    try {
      var dark = window.matchMedia &&
        window.matchMedia('(prefers-color-scheme: dark)').matches;
      var t = dark ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
      document.documentElement.style.colorScheme = t;
    } catch (e) {}
  })();
</script>

<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/shell.css">

<style>
  .login-wrap { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
  .login-card {
    width: 100%; max-width: 380px;
    background: var(--card); border: 1px solid var(--line);
    border-radius: var(--radius); box-shadow: var(--shadow-card); padding: 28px;
  }
  .login-brand { text-align: center; margin-bottom: 22px; }
  .login-brand .mark { width: 44px; height: 44px; margin: 0 auto 10px; display: block; }
  .login-title { font-size: 20px; font-weight: 800; letter-spacing: -.02em; }
  .login-title .dot { color: var(--accent); }
  .login-sub { font-size: 12.5px; color: var(--muted); margin-top: 3px; }

  .field { margin-bottom: 14px; }
  .field label {
    display: block; font-size: 11.5px; font-weight: 700; text-transform: uppercase;
    letter-spacing: .04em; color: var(--muted); margin-bottom: 5px;
  }
  .field input {
    width: 100%; border: 1px solid var(--line); border-radius: var(--radius-sm);
    padding: 10px 12px; font-family: inherit; font-size: 14px;
    color: var(--ink); background: var(--card);
  }
  .field input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-tint); }
  .field input.bad { border-color: var(--danger); }
  .field .hint { font-size: 11.5px; color: var(--faint); margin-top: 4px; }

  .login-btn { width: 100%; padding: 11px; font-size: 14px; margin-top: 4px; }

  .msg { font-size: 12.5px; border-radius: var(--radius-sm); padding: 9px 11px; margin-bottom: 14px; display: none; }
  .msg.err { display: block; background: var(--danger-tint); color: var(--danger); }
  .msg.ok  { display: block; background: var(--success-tint); color: var(--success-dk); }

  .note {
    background: var(--warn-tint); color: var(--warn-dk);
    font-size: 12.5px; border-radius: var(--radius-sm);
    padding: 10px 12px; margin-bottom: 18px; line-height: 1.5;
  }
  .foot { display: flex; justify-content: space-between; margin-top: 16px; font-size: 12.5px; }
  .foot a, .foot button.linkish {
    color: var(--muted); text-decoration: underline; background: none; border: 0;
    padding: 0; font: inherit; cursor: pointer;
  }
</style>
</head>
<body data-app="hub">

<div class="login-wrap">
  <div class="login-card">
    <div class="login-brand">
      <img class="mark" src="/assets/favicon.svg" alt="">
      <div class="login-title">alliteration<span class="dot">.</span></div>
      <div class="login-sub" id="who">Change password</div>
    </div>

    <div id="forcedNote" class="note" hidden>
      You signed in with a temporary password. Pick your own to keep going.
      Nobody else, including whoever set the temporary one, will be able to see it.
    </div>

    <div id="msg" class="msg"></div>

    <form id="pwForm" hidden>
      <div class="field">
        <label for="current" id="currentLabel">Current password</label>
        <input id="current" name="current" type="password" autocomplete="current-password" required>
      </div>

      <div class="field">
        <label for="password">New password</label>
        <input id="password" name="password" type="password" autocomplete="new-password" required minlength="8">
        <div class="hint">At least 8 characters. A short phrase is easier to remember than random letters.</div>
      </div>

      <div class="field">
        <label for="confirm">New password again</label>
        <input id="confirm" name="confirm" type="password" autocomplete="new-password" required minlength="8">
      </div>

      <button type="submit" class="btn btn-accent login-btn" id="submitBtn">Save new password</button>
    </form>

    <div class="foot">
      <a href="/" id="backLink" hidden>Back to the apps</a>
      <button type="button" class="linkish" id="signOutBtn">Sign out</button>
    </div>
  </div>
</div>

<script>
  (function () {
    var form = document.getElementById('pwForm');
    var msg = document.getElementById('msg');
    var btn = document.getElementById('submitBtn');
    var cur = document.getElementById('current');
    var pw = document.getElementById('password');
    var conf = document.getElementById('confirm');
    var forced = false;

    function show(text, kind) { msg.textContent = text; msg.className = 'msg ' + kind; }
    function clearBad() { [cur, pw, conf].forEach(function (i) { i.classList.remove('bad'); }); }

    function api(payload) {
      return fetch('/api/auth', {
        method: 'POST',
        credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      }).then(function (r) {
        return r.json().catch(function () { return {}; }).then(function (d) { return { ok: r.ok, data: d }; });
      });
    }

    fetch('/api/auth?action=session', { credentials: 'same-origin' })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        if (!data || !data.authenticated) { location.replace('login.html'); return; }
        forced = data.mustChangePassword === true;
        var name = (data.user && (data.user.name || data.user.username)) || '';
        document.getElementById('who').textContent = name ? 'Change password for ' + name : 'Change password';
        document.getElementById('forcedNote').hidden = !forced;
        document.getElementById('backLink').hidden = forced;
        if (forced) document.getElementById('currentLabel').textContent = 'Temporary password';
        form.hidden = false;
        cur.focus();
      })
      .catch(function () { show('Cannot reach the server. Try again in a moment.', 'err'); });

    document.getElementById('signOutBtn').addEventListener('click', function () {
      api({ action: 'logout' }).then(function () { location.replace('login.html'); },
                                     function () { location.replace('login.html'); });
    });

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      clearBad();
      msg.className = 'msg';

      // Checked here for a quick answer; the server checks all of it again.
      if (pw.value.length < 8) { pw.classList.add('bad'); show('Pick a password at least 8 characters long.', 'err'); return; }
      if (pw.value !== conf.value) { conf.classList.add('bad'); show("The two new passwords don't match.", 'err'); return; }
      if (pw.value === cur.value) { pw.classList.add('bad'); show('Pick a new password, not the one you have now.', 'err'); return; }

      btn.disabled = true;
      api({ action: 'change', current: cur.value, password: pw.value }).then(function (r) {
        if (!r.ok) {
          if (r.data.field === 'current') cur.classList.add('bad');
          if (r.data.field === 'password') pw.classList.add('bad');
          show(r.data.error || 'That did not work. Try again.', 'err');
          btn.disabled = false;
          return;
        }
        cur.value = pw.value = conf.value = '';
        show('Password changed. Loading the apps...', 'ok');
        setTimeout(function () { location.replace('/'); }, 700);
      }, function () {
        show('Network error. Try again.', 'err');
        btn.disabled = false;
      });
    });
  })();
</script>

</body>
</html>
