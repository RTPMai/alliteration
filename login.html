<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Sign in — alliteration.</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<!-- Theme, before any stylesheet.

     Sign-in FOLLOWS THE SYSTEM ONLY. It deliberately does not read the stored
     preference, because test/auth-live.test.cjs forbids this page from
     touching browser storage at all: it is the one screen that handles a
     password, and the cheapest way to guarantee a password is never persisted
     is for the page to have no storage code in it to audit. An explicit
     light-or-dark override therefore does not apply here, only on the app
     itself. That is the right way round to lose the argument.

     Everything after sign-in uses the stored preference (js/theme.js). -->
<script>
  (function () {
    try {
      var dark = window.matchMedia &&
        window.matchMedia('(prefers-color-scheme: dark)').matches;
      var t = dark ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
      document.documentElement.style.colorScheme = t;
    } catch (e) {}
  })();
</script>

<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/shell.css">

<style>
  /* Sign-in is the one screen with no rail and no header, so it carries a
     little layout of its own. Colors still come from tokens.css. */
  .login-wrap {
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
  }
  .login-card {
    width: 100%;
    max-width: 380px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow-card);
    padding: 28px;
  }
  .login-brand { text-align: center; margin-bottom: 22px; }
  .login-brand .mark { width: 44px; height: 44px; margin: 0 auto 10px; display: block; }
  .login-title { font-size: 20px; font-weight: 800; letter-spacing: -.02em; }
  .login-title .dot { color: var(--accent); }
  .login-sub { font-size: 12.5px; color: var(--muted); margin-top: 3px; }

  .field { margin-bottom: 14px; }
  .field label {
    display: block;
    font-size: 11.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .04em;
    color: var(--muted);
    margin-bottom: 5px;
  }
  .field input {
    width: 100%;
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    padding: 10px 12px;
    font-family: inherit;
    font-size: 14px;
    color: var(--ink);
    background: var(--card);
  }
  .field input:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-tint);
  }
  .field .hint { font-size: 11.5px; color: var(--faint); margin-top: 4px; }

  .login-btn { width: 100%; padding: 11px; font-size: 14px; margin-top: 4px; }

  .msg {
    font-size: 12.5px;
    border-radius: var(--radius-sm);
    padding: 9px 11px;
    margin-bottom: 14px;
    display: none;
  }
  .msg.err { display: block; background: var(--danger-tint); color: var(--danger); }
  .msg.ok  { display: block; background: var(--success-tint); color: var(--success-dk); }

  .setup-note {
    background: var(--accent-tint);
    color: var(--accent-deep);
    font-size: 12.5px;
    border-radius: var(--radius-sm);
    padding: 10px 12px;
    margin-bottom: 18px;
    line-height: 1.5;
  }
</style>
</head>
<body data-app="hub">

<div class="login-wrap">
  <div class="login-card">
    <div class="login-brand">

path fill="#fff" d="M111.25,53.01c-3.45-3.48-7.36-4.93-12.02-3.22-1.15.42-2.62,1.56-4.43,3.4-3.26,3.34-5.99,6.18-8.17,8.54-1.45,1.57-1.78,3.26-.99,5.07.87,2,2.24,2.78,4.1,2.34.21-.05.4-.15.55-.29,1.13-1.02,3.78-3.65,7.94-7.89,1.61-1.64,2.78-2.55,3.51-2.7,1.57-.33,2.93.08,4.09,1.25,1.91,1.92,4.77,4.8,8.58,8.64,1.57,1.58,2.47,2.86,2.69,3.81.37,1.59-.11,3.04-1.43,4.33-3.11,3.03-6.11,6.07-9.02,9.14-1.98,2.09-3.92,3.12-6.43,1.62-.06-.04-.11-.07-.15-.12l-9.77-9.77c-.36-.36-.84-.57-1.35-.58-1.71-.03-2.89.77-3.57,2.39-.84,2-.5,3.78,1.02,5.35,2.96,3.06,5.97,6.13,9.02,9.22,3.12,3.15,7.36,3.88,11.46,2.33.98-.37,2.43-1.52,4.36-3.44,3.94-3.94,7.46-7.48,10.56-10.62,1.59-1.61,2.59-2.84,3.01-3.68,2.12-4.29,1.5-9.58-1.81-13.06-3.35-3.53-7.27-7.55-11.74-12.06Z"/><path fill="#fff" d="M94.29,95.36c-2.55-2.77-5.66-5.96-9.34-9.56-2.38-2.33-4.72-2.33-7.02,0-1.13,1.16-1.28,2.85-.16,4.02.62.65,3.43,3.55,8.43,8.71,1.59,1.64,1.85,3.93.49,5.8-.12.16-.69.77-1.73,1.83-3.36,3.44-6.53,6.61-9.5,9.5-1.46,1.42-3.02,1.91-4.67,1.47-.96-.25-2.3-1.27-4.02-3.05-4.05-4.15-6.75-6.91-8.09-8.27-2.39-2.42-2.36-4.91.11-7.44,2.2-2.27,4.86-5,7.96-8.17,3.34-3.42-2.96-7.97-6.38-4.69-.87.83-3.64,3.62-8.29,8.34-3.45,3.51-5.25,7.38-3.48,12.26.54,1.49,1.84,3.31,3.91,5.46,3.14,3.25,6.67,6.82,10.59,10.71,3.27,3.25,6.94,4.47,11,3.65,3.09-.62,5.24-2.12,7.44-4.34,2.74-2.76,5.94-5.96,9.61-9.6,2.48-2.47,4.02-4.43,4.63-5.89,1.37-3.3,1.07-6.62-.88-9.96-.17-.3-.37-.57-.6-.82Z"/><path fill="#52A246" d="M71.33,64.73c-4.38.35-7.65,4.14-7.3,8.46.35,4.32,4.18,7.54,8.56,7.18,4.38-.35,7.65-4.14,7.3-8.46-.35-4.32-4.18-7.54-8.56-7.18Z"/></g></svg>
      <div class="login-title">alliteration<span class="dot">.</span></div>
      <div class="login-sub" id="loginSub">P&amp;M Apparel</div>
    </div>

    <div id="setupNote" class="setup-note" hidden>
      No accounts exist yet. The first account you create is the administrator,
      and it is the only one that can add everyone else.
    </div>

    <div id="msg" class="msg"></div>

    <form id="loginForm">
      <div class="field">
        <label for="username">Username</label>
        <input id="username" name="username" autocomplete="username" required autofocus>
        <div class="hint" id="userHint" hidden>3-32 characters: letters, numbers, dot, dash, underscore</div>
      </div>

      <div class="field" id="nameField" hidden>
        <label for="name">Full name</label>
        <input id="name" name="name" autocomplete="name">
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <div class="hint" id="pwHint" hidden>At least 8 characters</div>
      </div>

      <button type="submit" class="btn btn-accent login-btn" id="submitBtn">Sign in</button>
    </form>
  </div>
</div>

<script type="module">
  const form   = document.getElementById('loginForm');
  const msg    = document.getElementById('msg');
  const btn    = document.getElementById('submitBtn');
  const note   = document.getElementById('setupNote');
  const nameF  = document.getElementById('nameField');
  const sub    = document.getElementById('loginSub');
  const uHint  = document.getElementById('userHint');
  const pHint  = document.getElementById('pwHint');

  let mode = 'login';

  function show(text, kind) {
    msg.textContent = text;
    msg.className = 'msg ' + kind;
  }

  function setSetupMode() {
    mode = 'bootstrap';
    note.hidden = false;
    nameF.hidden = false;
    uHint.hidden = false;
    pHint.hidden = false;
    sub.textContent = 'Create the first account';
    btn.textContent = 'Create account';
    document.getElementById('password').setAttribute('autocomplete', 'new-password');
  }

  // Ask the server whether anyone has an account yet. If not, this becomes the
  // setup screen instead of the sign-in screen.
  //
  // Wrapped in a function rather than using top-level await: top-level await
  // needs a recent browser, and when it is unsupported the whole module fails
  // to parse, giving a blank screen with nothing in the console to explain it.
  async function checkSession() {
    try {
      const res = await fetch('/api/auth?action=session', { credentials: 'same-origin' });
      const data = await res.json();

      // 503 + setup:true means an environment variable is missing. Show the
      // server's own message rather than a vague failure, and hide the form,
      // since signing in cannot work until it is fixed.
      if (data.setup) {
        show(data.error, 'err');
        form.hidden = true;
        return;
      }

      if (data.authenticated) {
        location.replace('/');
      } else if (data.needsSetup) {
        setSetupMode();
      }
    } catch (e) {
      show('Cannot reach the server. Open /api/health to see what is missing.', 'err');
    }
  }

  checkSession();

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    btn.disabled = true;
    msg.className = 'msg';

    const payload = {
      action: mode,
      username: document.getElementById('username').value.trim(),
      password: document.getElementById('password').value,
    };
    if (mode === 'bootstrap') payload.name = document.getElementById('name').value.trim();

    try {
      const res = await fetch('/api/auth', {
        method: 'POST',
        credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
      const data = await res.json();

      if (!res.ok) {
        show(data.error || 'Sign in failed', 'err');
        btn.disabled = false;
        return;
      }

      show('Signed in. Loading...', 'ok');
      location.replace('/');
    } catch (err) {
      show('Network error. Try again.', 'err');
      btn.disabled = false;
    }
  });
</script>

</body>
</html>
